<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>自选股悬浮窗 · 交互原型 v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #2b3547 0%, #3a4a63 55%, #2b3547 100%);
    min-height: 100vh; user-select: none; color: #e8ecf4;
  }
  /* ---------- 假的"办公窗口"，衬托悬浮感 ---------- */
  .fake-window { position: absolute; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 6px; }
  .fake-window .bar { height: 26px; border-bottom: 1px solid rgba(255,255,255,.05); display:flex; align-items:center; gap:5px; padding: 0 8px; }
  .fake-window .bar i { width: 7px; height: 7px; border-radius: 50%; display:inline-block; }
  .fake-window .content { padding: 12px; color: rgba(255,255,255,.15); font-size: 12px; line-height: 1.9; letter-spacing: 1px; }
  #win1 { top: 40px;  left: 60px;  width: 420px; height: 210px; }
  #win2 { top: 290px; left: 60px;  width: 420px; height: 150px; }
  #win3 { top: 70px;  right: 90px; width: 460px; height: 260px; }

  /* ---------- 悬浮窗整体 ---------- */
  .float-widget {
    position: fixed; left: 120px; bottom: 150px; z-index: 99;
    width: 430px;
    background: rgba(20, 23, 30, .95);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    overflow: hidden;
  }

  /* ---------- 窄条（常驻形态：滚动播放） ---------- */
  .ticker-bar { display: flex; align-items: center; height: 38px; cursor: pointer; }
  .ticker-title {
    flex: 0 0 auto; display:flex; align-items:center; gap:6px;
    padding: 0 12px; border-right: 1px solid rgba(255,255,255,.12);
    font-size: 12px; color: #dbe7ff; font-weight: 600; height: 100%;
  }
  .ticker-title .dot { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .ticker-scroll { flex: 1 1 auto; overflow: hidden; height: 100%; position: relative; }
  .ticker-track {
    display: inline-flex; align-items: center; height: 100%;
    white-space: nowrap; will-change: transform;
    animation: marquee 26s linear infinite;
  }
  .float-widget.paused .ticker-track { animation-play-state: paused; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tk-item { display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 13px; }
  .tk-name { color: #f2f5fa; }
  .tk-price { color: #ffffff; font-variant-numeric: tabular-nums; font-weight: 600; }
  .tk-pct  { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 56px; }
  .tk-bar-arrow { flex: 0 0 auto; padding: 0 10px; color: #9fb0c6; font-size: 11px; }

  /* ---------- 展开面板 ---------- */
  .panel { border-top: 1px solid rgba(255,255,255,.10); display: none; }
  .float-widget.open .panel { display: block; }

  /* 搜索框（仅展开时可见） */
  .search-zone { padding: 10px 12px 6px; }
  .search-zone input {
    width: 100%; padding: 8px 12px; font-size: 13px; color: #eef2f8;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px; outline: none;
  }
  .search-zone input::placeholder { color: #7c8aa0; }
  .search-zone input:focus { border-color: #4a9eff; background: rgba(255,255,255,.10); }
  .suggest {
    margin: 6px 12px 0; padding: 4px; background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.10); border-radius: 6px; display: none;
    max-height: 150px; overflow: auto;
  }
  .suggest .opt { padding: 6px 8px; font-size: 12px; cursor: pointer; color: #dfe7f2; border-radius: 4px; display:flex; justify-content: space-between; }
  .suggest .opt:hover, .suggest .opt.sel { background: #4a9eff; color: #fff; }
  .search-msg { padding: 2px 12px 8px; font-size: 11px; color: #8ea0bb; min-height: 15px; }

  /* 表头：三列可点击排序 */
  .panel-head {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.1fr; gap: 8px; align-items: center;
    padding: 6px 14px; font-size: 12px; color: #93a1b5;
    border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .sortable { cursor: pointer; text-align: right; user-select: none; color: #b9c6d8; }
  .sortable:hover { color: #fff; }
  .sortable .mark { margin-left: 3px; font-size: 10px; color: #4a9eff; }
  .ph { text-align: right; }

  /* 列表行 */
  .watch-rows { max-height: 264px; overflow-y: auto; }
  .watch-row {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr 1.1fr; gap: 8px; align-items: center;
    padding: 6px 14px; font-size: 13px; position: relative;
    border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .watch-row:hover { background: rgba(255,255,255,.06); }
  .w-name { color: #f2f5fa; font-weight: 600; }
  .w-code { color: #8294ab; font-size: 11px; margin-left: 6px; font-weight: 400; }
  .w-price, .w-delta, .w-pct { text-align: right; font-variant-numeric: tabular-nums; }
  .w-price { color: #ffffff; font-weight: 600; }
  .w-delta, .w-pct { font-weight: 600; }
  .w-del {
    position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; line-height: 15px; text-align: center;
    border-radius: 50%; color: #7c8aa0; cursor: pointer; display: none; font-size: 12px;
  }
  .watch-row:hover .w-del { display: block; }
  .w-del:hover { background: rgba(255,255,255,.15); color: #ff7a7a; }
  .empty-tip { padding: 18px 14px; text-align: center; color: #7c8aa0; font-size: 12px; }

  /* 涨跌色：A股 红涨绿跌 */
  .up   { color: #ff5252 !important; }
  .down { color: #2ecc71 !important; }
  .flat { color: #a8b2c0 !important; }

  .panel-foot { padding: 5px 14px; font-size: 10px; color: #6d7c92; text-align: right; border-top: 1px solid rgba(255,255,255,.04); }
</style>
</head>
<body>

<div class="fake-window" id="win1"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="content">工作文档 · 周报进度<br>……</div></div>
<div class="fake-window" id="win2"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="content">表格数据整理……</div></div>
<div class="fake-window" id="win3"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="content">IM 对话窗口……</div></div>

<div class="float-widget" id="widget">
  <div class="ticker-bar" id="bar">
    <div class="ticker-title"><span class="dot"></span>自选股 <span id="count"></span></div>
    <div class="ticker-scroll" id="scrollBox"><div class="ticker-track" id="track"></div></div>
    <div class="tk-bar-arrow" id="arrow">▲</div>
  </div>

  <div class="panel">
    <!-- 搜索添加：仅展开时显示 -->
    <div class="search-zone">
      <input id="searchInput" type="text" placeholder="输入代码或名称搜索，回车添加（如 600519 / 茅台）" autocomplete="off">
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="search-msg" id="searchMsg"></div>

    <div class="panel-head">
      <span>名称</span>
      <span class="sortable ph" data-key="price">最新价<span class="mark"></span></span>
      <span class="sortable ph" data-key="delta">涨跌<span class="mark"></span></span>
      <span class="sortable ph" data-key="pct">涨跌幅<span class="mark"></span></span>
    </div>
    <div class="watch-rows" id="rows"></div>
    <div class="panel-foot">行情为模拟数据 · 悬停行尾 ✕ 可删除 · 真实数据接入待定</div>
  </div>
</div>

<script>
/* ================= 数据 =================
   数据源:IPC(window.wt,Electron 内)或降级(无 wt 时纯浏览器预览用确定性伪行情)。
   自选列表 localStorage 持久化,启动即拉真实行情。 */
const IPC = typeof window !== 'undefined' && !!window.wt;

const DEFAULT_WATCH = [
  { quoteId: '1.600519', code: '600519', name: '贵州茅台', base: 1458 },
  { quoteId: '0.300750', code: '300750', name: '宁德时代', base: 186.4 },
  { quoteId: '0.002594', code: '002594', name: '比亚迪', base: 241.2 },
  { quoteId: '1.601318', code: '601318', name: '中国平安', base: 48.16 },
  { quoteId: '0.000858', code: '000858', name: '五粮液', base: 128.55 },
  { quoteId: '1.600036', code: '600036', name: '招商银行', base: 34.28 },
  { quoteId: '1.688981', code: '688981', name: '中芯国际', base: 52.9 },
  { quoteId: '1.601899', code: '601899', name: '紫金矿业', base: 17.42 },
];
const LS_KEY = 'wt.watch.v1';

function loadWatch() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const a = JSON.parse(raw);
      if (Array.isArray(a) && a.length) return a.map(w => ({ quoteId: String(w.quoteId), code: String(w.code), name: String(w.name) }));
    }
  } catch (e) { /* localStorage 损坏 → 回默认 */ }
  return DEFAULT_WATCH.map(w => ({ quoteId: w.quoteId, code: w.code, name: w.name }));
}
function saveWatch() { try { localStorage.setItem(LS_KEY, JSON.stringify(watch)); } catch (e) {} }

let watch = loadWatch();   // 自选引用列表(增删即持久化)
let quotes = [];           // 行情快照(渲染源)

/* ================= 数据源适配 ================= */
async function doSearch(kw) {   // 联想 → 候选 [{quoteId,code,name,securityType}]
  if (IPC) { try { return await window.wt.suggest(kw); } catch (e) { return []; } }
  return [];
}
async function doFetchQuotes(items) {   // 批量行情 → [{quoteId,market,code,name,price,delta,pct}]
  if (!items.length) return [];
  if (IPC) {
    try { return await window.wt.quotes(items.map(w => w.quoteId)); } catch (e) { return []; }
  }
  // 降级:浏览器直开时确定性伪行情,保证预览可跑(注意:此分支仅供无 Electron 时看布局)
  const phase = Date.now() / 2000;
  return items.map((w, i) => {
    const base = w.base || 10 + ((w.code.charCodeAt(0) * 7 + w.code.length * 13) % 900);
    const price = base * (1 + Math.sin(phase + i * 1.7) * 0.004);
    return { quoteId: w.quoteId, market: w.quoteId.split('.')[0], code: w.code, name: w.name, price, delta: price - base, pct: ((price - base) / base) * 100 };
  });
}

/* 快照刷新:拉行情 → 渲染。网络失败时保留旧快照(静默) */
async function refresh() {
  const list = await doFetchQuotes(watch);
  if (list && list.length) quotes = list;
  renderTicker();
  renderPanel();
}

const cls = v => (v === null || v === undefined || Number.isNaN(v)) ? 'flat' : v > 0.0005 ? 'up' : v < -0.0005 ? 'down' : 'flat';
const fmt = (n, d = 2) => (n === null || n === undefined || Number.isNaN(n)) ? '--' : n.toFixed(d);
const signed = (n, d = 2) => (n === null || n === undefined || Number.isNaN(n)) ? '--' : (n >= 0 ? '+' : '') + n.toFixed(d);

/* ================= 排序状态 ================= */
let sort = { key: null, dir: 1 };   // key: 'price'|'delta'|'pct'|null(加入序)

function sortedRows() {
  if (!sort.key) return quotes.slice();
  const k = sort.key;
  return quotes.slice().sort((a, b) => (a[k] - b[k]) * sort.dir);
}
function clickSort(key) {
  const marks = document.querySelectorAll('.sortable .mark');
  marks.forEach(m => m.textContent = '');
  if (sort.key === key) sort.dir = -sort.dir;          // 同列：反向
  else { sort.key = key; sort.dir = -1; }              // 新列：先降序
  const mark = document.querySelector(`.sortable[data-key="${key}"] .mark`);
  mark.textContent = sort.dir === -1 ? '▼' : '▲';
  renderPanel();
}

/* ================= 渲染 ================= */
function ensureMarqueeWidth() {
  const track = document.getElementById('track');
  const box = document.getElementById('scrollBox');
  let n = 2;
  track.innerHTML = track.innerHTML.repeat(1);         // 重建单份测量
  const part = track.innerHTML;
  while (box.scrollWidth > 0 && track.scrollWidth < box.clientWidth * 2 && n < 8) {
    track.innerHTML = part.repeat(n *= 2);
  }
}
function renderTicker() {
  if (!quotes.length) { document.getElementById('track').innerHTML = ''; return; }
  const part = quotes.map(q => `
    <span class="tk-item">
      <span class="tk-name">${q.name}</span>
      <span class="tk-price ${cls(q.delta)}">${fmt(q.price)}</span>
      <span class="tk-pct ${cls(q.delta)}">${q.delta >= 0 ? '▲' : '▼'} ${signed(q.pct)}%</span>
    </span>`).join('');
  document.getElementById('track').innerHTML = part + part;
  ensureMarqueeWidth();
  document.getElementById('count').textContent = `(${quotes.length})`;
}

function renderPanel() {
  const rows = document.getElementById('rows');
  if (!quotes.length) {
    rows.innerHTML = '<div class="empty-tip">暂无自选股 —— 用上方搜索框添加</div>';
    return;
  }
  rows.innerHTML = sortedRows().map((q, i) => `
    <div class="watch-row" data-qid="${q.quoteId}">
      <span class="w-name">${q.name}<span class="w-code">${q.code}</span></span>
      <span class="w-price ${cls(q.delta)}">${fmt(q.price)}</span>
      <span class="w-delta ${cls(q.delta)}">${signed(q.delta)}</span>
      <span class="w-pct ${cls(q.delta)}">${signed(q.pct)}%</span>
      <span class="w-del" title="删除">✕</span>
    </div>`).join('');
}

/* ================= 展开/收起 + 排序 + 删除 ================= */
const widget = document.getElementById('widget');
const arrow = document.getElementById('arrow');
document.getElementById('bar').addEventListener('click', () => {
  widget.classList.toggle('open');
  arrow.textContent = widget.classList.contains('open') ? '▼' : '▲';
  if (widget.classList.contains('open')) {
    setTimeout(() => searchInput.focus(), 30);
  } else {
    hideSuggest(); msg('');
  }
});
document.querySelectorAll('.sortable').forEach(th => {
  th.addEventListener('click', () => clickSort(th.dataset.key));
});
document.getElementById('rows').addEventListener('click', e => {
  const del = e.target.closest('.w-del');
  if (!del) return;
  const qid = del.closest('.watch-row').dataset.qid;
  if (!qid) return;
  watch = watch.filter(w => w.quoteId !== qid);
  quotes = quotes.filter(q => q.quoteId !== qid);
  saveWatch();
  renderTicker(); renderPanel(); hideSuggest();
});

// 悬停暂停滚动
const scrollBox = document.getElementById('scrollBox');
scrollBox.addEventListener('mouseenter', () => widget.classList.add('paused'));
scrollBox.addEventListener('mouseleave', () => widget.classList.remove('paused'));

/* ================= 搜索添加(真实联想) ================= */
const searchInput = document.getElementById('searchInput');
const suggestBox = document.getElementById('suggest');
const msgEl = document.getElementById('searchMsg');
let curHits = [];

function msg(t) { msgEl.textContent = t || ''; }
function hideSuggest() { suggestBox.style.display = 'none'; suggestBox.innerHTML = ''; }
function inWatch(item) { return watch.some(w => w.quoteId === item.quoteId); }

function addStock(item) {   // item: {quoteId, code, name}
  if (!item || !item.quoteId) { msg('未找到该标的'); return; }
  if (inWatch(item)) { msg(`「${item.name}」已在自选股中`); return; }
  watch.push({ quoteId: item.quoteId, code: item.code, name: item.name });
  saveWatch();
  if (sort.key) { sort.key = null; document.querySelectorAll('.sortable .mark').forEach(m => m.textContent = ''); }
  refresh();
  msg(`已添加 ${item.name}（${item.code}）`);
}

let debounceTimer = null;
function onSearchInput() {
  clearTimeout(debounceTimer);
  const kw = searchInput.value.trim();
  if (!kw) { hideSuggest(); msg(''); return; }
  debounceTimer = setTimeout(async () => {
    const hits = await doSearch(kw);
    curHits = hits.slice(0, 8);
    if (!curHits.length) { hideSuggest(); return; }
    suggestBox.innerHTML = curHits.map(h =>
      `<div class="opt" data-qid="${h.quoteId}">${h.name}<span>${h.code} · ${h.securityType || ''}</span></div>`).join('');
    suggestBox.style.display = 'block';
  }, 220);
}
searchInput.addEventListener('input', onSearchInput);
searchInput.addEventListener('focus', onSearchInput);
searchInput.addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const hits = await doSearch(searchInput.value.trim());
  if (hits.length === 1) {
    addStock(hits[0]); searchInput.value = ''; hideSuggest(); msg('');
  } else if (hits.length > 1) {
    curHits = hits.slice(0, 8);
    msg('匹配到多个，点选下方候选');
  } else {
    msg('未匹配到，试试完整代码（如 600519 / 00700 / AAPL / cu2609）');
  }
});
suggestBox.addEventListener('mousedown', e => {
  const opt = e.target.closest('.opt');
  if (opt) {
    const hit = curHits.find(h => h.quoteId === opt.dataset.qid);
    if (hit) addStock(hit);
  }
  searchInput.value = ''; hideSuggest(); msg('');
});

/* ================= 行情刷新循环(真实行情轮询) ================= */
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
